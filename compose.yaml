# OIEP — Docker Compose for a single small server.
#
# Local run (no Cloudflare):
#   docker compose up -d --build
#   -> http://127.0.0.1:8080
#
# Public run through Cloudflare Tunnel:
#   1. put CLOUDFLARE_TUNNEL_TOKEN=... in .env
#   2. docker compose --profile tunnel up -d --build
#
# The app port is bound to 127.0.0.1 on purpose: the tunnel reaches it over
# the private Docker network, and strangers on the internet cannot hit port
# 8080 directly. Read docs/DEPLOY.md before exposing anything.

name: oiep

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oiep:local
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # The JVM needs ordinary file and network access only, never Linux capabilities.
    cap_drop:
      - ALL
    # Bound the process count (threads count as pids) so a runaway or compromised process
    # cannot fork-bomb the host. The JVM uses well under this.
    pids_limit: 512
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      OIEP_DB_PATH: /data/oiep.db
      OIEP_DEMO_DATA: ${OIEP_DEMO_DATA:-false}
      OIEP_ADMIN_USERNAME: ${OIEP_ADMIN_USERNAME:-admin}
      OIEP_ADMIN_PASSWORD: ${OIEP_ADMIN_PASSWORD:-}
      # Visitors reach this container only through Cloudflare Tunnel, and the app port is
      # bound to loopback, so every request that arrives here passed through Cloudflare.
      # The app uses Tomcat's native RemoteIpValve (application.properties) pointed at
      # Cloudflare's CF-Connecting-IP header: client-supplied X-Forwarded-For / Forwarded
      # headers are ignored, so per-IP throttles cannot be bypassed by rotating them, and
      # forwarded Host values cannot forge redirects. Host/scheme still come from the
      # trusted tunnel hop, which is what absolute redirects and HSTS need.
      OIEP_TRUST_CLOUDFLARE_CONNECTING_IP: ${OIEP_TRUST_CLOUDFLARE_CONNECTING_IP:-true}
      # The public site is HTTPS (TLS terminates at Cloudflare), so sessions can be
      # marked Secure. Local plain-HTTP development outside Docker keeps the default false.
      OIEP_SESSION_COOKIE_SECURE: ${OIEP_SESSION_COOKIE_SECURE:-true}
    volumes:
      - oiep-data:/data
    ports:
      - "127.0.0.1:${OIEP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The tunnel only makes outbound connections; it needs no capabilities.
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      app:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  oiep-data:
    # Fixed name so the backup/restore scripts can find it regardless of the
    # directory name you cloned into.
    name: oiep-data
