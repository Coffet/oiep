name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and package the WAR
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packaged WAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oiep-war
          path: target/oiep.war
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: oiep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name oiep-ci -p 18080:8080 oiep:ci

      - name: Wait for the public page
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              echo "OIEP responded after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "OIEP did not become ready" >&2
          docker logs oiep-ci
          exit 1

      - name: Check baseline headers and admin redirect
        run: |
          curl -sS -o /dev/null -D response-headers.txt http://127.0.0.1:18080/
          grep -qi '^x-content-type-options: nosniff' response-headers.txt
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/admin)
          test "$status" = "302"

      - name: Show container logs
        if: always()
        run: docker logs oiep-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f oiep-ci || true
