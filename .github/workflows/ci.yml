name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and package the WAR
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packaged WAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oiep-war
          path: target/oiep.war
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: oiep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          # The app applies the Secure session-cookie attribute from configuration
          # (OIEP_SESSION_COOKIE_SECURE), independent of the scheme this smoke test uses over
          # plain HTTP; the production opt-in is enabled explicitly and a throw-away admin
          # password makes the login page allocate a session (and therefore a Set-Cookie
          # header).
          docker run -d --name oiep-ci \
            -p 18080:8080 \
            -e OIEP_SESSION_COOKIE_SECURE=true \
            -e OIEP_ADMIN_USERNAME=ci-admin \
            -e OIEP_ADMIN_PASSWORD=ci-smoke-test-only-9f3a2b1c \
            oiep:ci

      - name: Wait for the public page
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              echo "OIEP responded after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "OIEP did not become ready" >&2
          docker logs oiep-ci
          exit 1

      - name: Check security headers, relative admin redirect and session cookie
        run: |
          set -eu
          base=http://127.0.0.1:18080

          # Dynamic HTML: baseline headers, CSP with per-inline SHA-256 hashes and no
          # 'unsafe-inline', and cross-origin isolation headers.
          curl -sS -o /dev/null -D page-headers.txt "$base/"
          grep -qi '^x-content-type-options: nosniff' page-headers.txt
          grep -qi '^x-frame-options: DENY' page-headers.txt
          grep -qi '^cross-origin-opener-policy: same-origin' page-headers.txt
          grep -qi '^content-security-policy: .*sha256-' page-headers.txt
          if grep -qi 'unsafe-inline' page-headers.txt; then
            echo "Content-Security-Policy still contains 'unsafe-inline'" >&2
            exit 1
          fi

          # /admin must redirect with a relative Location, so a forged Host /
          # X-Forwarded-Host header can never turn the redirect into a cross-host one.
          admin_status=$(curl -sS -o /dev/null -D admin-headers.txt -w '%{http_code}' "$base/admin")
          test "$admin_status" = "302"
          grep -qi '^location: /admin/login' admin-headers.txt
          if grep -qiE '^location: https?://' admin-headers.txt; then
            echo "Admin redirect uses an absolute URL; expected a relative Location" >&2
            exit 1
          fi

          # Session cookie must carry Secure + HttpOnly + SameSite=Lax.
          login_status=$(curl -sS -o /dev/null -D login-headers.txt -w '%{http_code}' "$base/admin/login")
          test "$login_status" = "200"
          grep -qi '^set-cookie: JSESSIONID=' login-headers.txt
          grep -qi '^set-cookie: JSESSIONID=.*Secure' login-headers.txt
          grep -qi '^set-cookie: JSESSIONID=.*HttpOnly' login-headers.txt
          grep -qi '^set-cookie: JSESSIONID=.*SameSite=Lax' login-headers.txt

          echo "Security header, redirect and cookie assertions passed."

      - name: Show container logs
        if: always()
        run: docker logs oiep-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f oiep-ci || true
