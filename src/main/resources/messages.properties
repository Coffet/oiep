about.title=why this exists
about.lead=Most interview advice is either a press release or a shrug. OIEP is the note in between: what actually happened, from someone who just walked out.
about.quote=“I want to hear your experience. Not mine.”
about.quote.line1=“I want to hear your
about.quote.line2=experience. Not mine.”
about.values=No ads. No paywalls. No corporate spin.
about.section.problem=the problem
about.problem.p1=Most platforms either bury real experiences under reviews that read like PR, or leave you digging through posts from years ago. Fresh graduates and people changing fields catch the worst of it: silence, vague culture-fit language, and a process that changes shape every round.
about.problem.p2=When you're on the outside, you can't tell whether the silence means a rejection, a slow week, or a role that was never real. That's a bad way to prepare for an interview.
about.section.is=what this is
about.is.p1=After an interview, you can leave a short note: company, role, round, the questions or the type of questions, how long it took to hear back, whether they ghosted, salary if it came up, the vibe in the room. Anything useful.
about.is.p2=Search is open to everyone. No account needed. Posting is anonymous by default. If you want to contribute or help moderate, the roadmap includes lightweight accounts for that later.
about.section.how=how it works
about.how.p1=The point is not to rate companies like a product or collect a pile of grievances. It's to hand the next person a concrete picture of the room: what was asked, what took time, what felt off, what was better than expected.
about.how.p2=Reports are short and recent. The most useful ones surface, and the community helps keep spam and revenge posts out.
about.section.stack=the stack
about.stack.label.backend=Backend
about.stack.label.frontend=Frontend
about.stack.label.storage=Storage
about.stack.label.deploy=Deployment
about.stack.intro=The whole thing is deliberately simple, self-hostable, and open source.
about.stack.backend=Java Spring Boot, classic MVC with JSP views, servlets, JavaBeans, and a thin REST layer. SQLite is the default database, so setup stays close to zero.
about.stack.frontend=Server-rendered pages with progressive enhancement. Clean, accessible, minimal vanilla JS. No heavy SPA framework for the core experience.
about.stack.data=Local filesystem, plus optional MinIO or any S3-compatible store for screenshots and anonymised attachments, with an outbox/reconciler so nothing gets lost.
about.stack.deploy=A single VPS, Docker, or a Raspberry Pi. Cloudflare can front static assets if you want. English first, Chinese (zh-HK) available as a choice.
about.section.roadmap=what's next
about.roadmap.submission=Core submission and search forms. The first priority, and what you're looking at.
about.roadmap.tagging=Round, location, remote/on-site, and outcome tagging, so people can filter quickly.
about.roadmap.rating=Lightweight usefulness ratings — of the note, not the company — so the most helpful reports surface.
about.roadmap.moderation=A small community moderation dashboard, rate limiting, and an outbox for attachments.
about.roadmap.export=Export and backup tools, so the data stays portable and isn't locked to one host.
about.section.open=open source
about.open.p1=OIEP is non-profit, self-hosted, and community-maintained. Run your own instance, fork it, or leave a report after your next interview.
about.open.p2=If you've ever walked out of an interview thinking “I wish someone had told me that beforehand”, this is for you.
