# OIEP — 可選 AI 小幫手元件（繁體中文，香港，書面語）
# 與 messages.properties 一併載入（spring.messages.basename=messages,messages-companion）。
# 只在元件啟用時使用；設定請見 docs/COMPANION.md。

# --- 使用者小幫手：公開表格頁上的可選對話協助 ---
companion.helper.kicker=可選協助
