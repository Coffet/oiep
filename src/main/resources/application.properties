### OIEP runtime configuration ###

spring.application.name=OIEP

# --- MVC / JSP views (JSP files are owned by the frontend; only resolved at request time) ---
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# --- i18n / message bundles (UTF-8; Lead-owned resources/messages*.properties) ---
# Bundles: messages.properties = English (root/default), messages_zh_HK.properties = Chinese.
# fallback-to-system-locale MUST stay false here: the JDK tries the JVM default locale bundle
# *before* the root bundle, so with `true` an English request on a host whose default locale is
# zh_HK (this dev machine included) renders the Chinese bundle while <html lang="en">.
# With false: en -> root English bundle, zh-HK -> messages_zh_HK, and any missing zh-HK key
# falls back to the root English bundle (Java parent-bundle chain), which is what we want.
spring.messages.basename=messages,messages-companion
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Error handling: our own /error controller + error.jsp, no whitelabel page ---
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# --- Request/response encoding (Windows default is not UTF-8; force it) ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# --- Request limits (public, anonymous form: keep payloads small) ---
server.tomcat.max-http-form-post-size=256KB
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=1MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set OIEP_SESSION_COOKIE_SECURE=true whenever visitors reach the site over HTTPS
# (the shipped Docker + Cloudflare Tunnel setup does this in compose.yaml). It is
# opt-in so that `./mvnw spring-boot:run` over plain http still keeps its session.
server.servlet.session.cookie.secure=${OIEP_SESSION_COOKIE_SECURE:false}
# Never put ;jsessionid into URLs (session tracking via cookie only).
server.servlet.session.tracking-modes=cookie
# Send redirects as relative Location headers. The browser resolves them against the public
# origin, so a forged Host / X-Forwarded-Host / Forwarded header can never turn an app redirect
# into a cross-host open redirect, and TLS termination cannot produce a wrong scheme or port.
server.tomcat.use-relative-redirects=true
# Hard ceiling on server-side sessions (anonymous session-exhaustion DoS backstop).
oiep.sessions.max-active=${OIEP_SESSIONS_MAX_ACTIVE:10000}

# --- SQLite datasource (relative to the working directory; parent dirs created on boot) ---
# Bare-metal default: data/oiep.db. Docker sets OIEP_DB_PATH=/data/oiep.db (persistent volume).
spring.datasource.url=jdbc:sqlite:${OIEP_DB_PATH:data/oiep.db}?busy_timeout=5000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=OIEP-SQLite
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

# --- Schema bootstrap (idempotent CREATE TABLE IF NOT EXISTS) ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# --- Static assets: LEFT AT SPRING BOOT DEFAULTS (classpath:/static => /css, /js, /fonts, /img) ---
# Do not add a custom Spring resource handler here; it would shadow the defaults.

# --- Application settings ---
# Demo data is OFF by default: a normal boot shows the empty state.
# The explicit placeholder keeps the documented OIEP_DEMO_DATA environment variable
# working for Docker deployments as well as the --oiep.demo-data=true flag.
oiep.demo-data=${OIEP_DEMO_DATA:false}
# In-memory per-client submission limiter: 8 POSTs per 10 minutes.
oiep.rate-limit.max-requests=8
oiep.rate-limit.window-seconds=600
oiep.rate-limit.max-entries=10000
# Useful votes: 30 per hour per client (bounds counter stuffing and session churn).
oiep.helpful.rate-limit.max-requests=30
oiep.helpful.rate-limit.window-seconds=3600
oiep.helpful.rate-limit.max-entries=10000

# --- Client address resolution (rate limits and security logs) ---
# X-Forwarded-For is never trusted for per-client limits: clients can set it and an
# outer proxy may append to it, so trusting it lets an attacker rotate the header and
# bypass every throttle (including the admin login throttle).
#
# Native Tomcat RemoteIpValve handling: only a request whose immediate peer is a
# trusted/internal proxy address (the cloudflared container on the Docker network) may
# supply the client address and protocol. The valve reads Cloudflare's CF-Connecting-IP
# (set by Cloudflare's edge) and never X-Forwarded-For. For trusted peers it may also
# rewrite getServerName()/getServerPort() from X-Forwarded-Host/-Port; that is harmless
# here because redirects are relative and the origin check prefers the real Host header.
# A directly-exposed instance (peer = public address) keeps the real socket address.
# Do not switch to server.forward-headers-strategy=framework: it derives getRemoteAddr()
# from the client-controllable X-Forwarded-For/Forwarded headers, so the app refuses to
# start in that mode (see ClientAddressResolver).
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=CF-Connecting-IP
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.protocol-header-https-value=https
# Belt-and-braces: the resolver only reads CF-Connecting-IP when this explicit trust
# switch is on. Enable it for the shipped Cloudflare Tunnel deployment (compose.yaml does).
oiep.security.trust-cloudflare-connecting-ip=${OIEP_TRUST_CLOUDFLARE_CONNECTING_IP:false}

# --- Admin / moderation ---
# Set OIEP_ADMIN_PASSWORD to enable the /admin area. There is deliberately
# no default password: an unset value disables admin login.
oiep.admin.username=${OIEP_ADMIN_USERNAME:admin}
oiep.admin.password=${OIEP_ADMIN_PASSWORD:}
# In-memory per-client admin login throttle: 6 attempts per 15 minutes.
oiep.admin.login.max-attempts=6
oiep.admin.login.window-seconds=900
oiep.admin.login.max-entries=10000
# The login page allocates a CSRF-token session, so throttle page loads per client too:
# 30 login-page loads per 10 minutes.
oiep.admin.login.page.max-requests=30
oiep.admin.login.page.window-seconds=600
oiep.admin.login.page.max-entries=10000

# --- Logging ---
logging.level.root=INFO
logging.level.com.oiep=INFO
logging.level.org.springframework.web=INFO

# --- Optional AI companion component (oiep-backendAI) ---
# Self-contained, opt-in component. See docs/COMPANION.md for the full reference and for the
# add/remove procedure. With OIEP_COMPANION_ENABLED=false (the default) no component beans,
# routes, page fragments or CSP directives are registered: the application behaves exactly as
# if the component did not exist.
oiep.companion.enabled=${OIEP_COMPANION_ENABLED:false}
# Companion service origin, e.g. http://127.0.0.1:8090 or https://ai.oiep.example.
# Must be an origin (no path): the companion API uses absolute /v1/... paths.
oiep.companion.base-url=${OIEP_COMPANION_BASE_URL:}

# User helper: embeds the companion chat widget on the public form page (browser talks to the
# widget origin directly; only the exact origin is added to the CSP frame-src directive).
oiep.companion.user-helper.enabled=${OIEP_COMPANION_USER_HELPER_ENABLED:true}
# Full widget URL; defaults to <base-url>/ui/ when empty.
oiep.companion.user-helper.widget-url=${OIEP_COMPANION_WIDGET_URL:}

# Admin helper: operator-only page under /admin/assistant, proxied server-side so the token
# never reaches the browser.
oiep.companion.admin-helper.enabled=${OIEP_COMPANION_ADMIN_HELPER_ENABLED:false}
# Bearer token for the companion admin API. Server-side only; never rendered or logged.
oiep.companion.admin-helper.token=${OIEP_COMPANION_ADMIN_TOKEN:}

# Read-only experiences API (GET /api/v1/experiences) consumed by the companion's corpus sync.
oiep.companion.read-api.enabled=${OIEP_COMPANION_READ_API_ENABLED:false}
# Bearer token the companion service presents. Read-only: no other OIEP route accepts it.
oiep.companion.read-api.token=${OIEP_COMPANION_READ_TOKEN:}
oiep.companion.read-api.page-size=${OIEP_COMPANION_READ_PAGE_SIZE:200}
# The OIEP form does not collect interview difficulty, so the read adapter emits a documented
# value: difficulty-mode=constant (default) emits OIEP_COMPANION_READ_DIFFICULTY for every
# item; difficulty-mode=vibe-proxy derives a coarse value from the interviewer-vibe field.
oiep.companion.read-api.difficulty=${OIEP_COMPANION_READ_DIFFICULTY:MODERATE}
oiep.companion.read-api.difficulty-mode=${OIEP_COMPANION_READ_DIFFICULTY_MODE:constant}

# Timeouts for the server-side admin proxy (milliseconds).
oiep.companion.http.connect-timeout-ms=${OIEP_COMPANION_CONNECT_TIMEOUT_MS:3000}
oiep.companion.http.request-timeout-ms=${OIEP_COMPANION_REQUEST_TIMEOUT_MS:15000}
