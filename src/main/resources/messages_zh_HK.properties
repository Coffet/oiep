about.title=為什麼會有這個平台
about.lead=大部分面試資訊，不是寫得像公關稿，就是一句「等通知」。OIEP 想做中間那則筆記：由剛剛走出面試室的人，說出真實發生的事。
about.quote=「我想聽你的經驗，不是我的。」
about.quote.line1=「我想聽你的經驗，
about.quote.line2=不是我的。」
about.values=沒有廣告。沒有付費牆。沒有公關修飾。
about.section.problem=問題
about.problem.p1=大部分面試平台，不是把真實經驗埋在像公關稿的評論裡，就是要你翻幾年前的舊文。剛畢業、轉行的人最吃虧：等不到回音，聽到「文化契合」這類空話，還要應付每輪都不同的流程。
about.problem.p2=你站在外面，根本分不清那段沉默是被拒絕、公司動作慢，還是那個職位從來不存在。這樣去準備面試，很吃虧。
about.section.is=這是什麼
about.is.p1=面試結束後，你可以留下一則短筆記：公司、職位、輪次、問了什麼、等了多久、對方有沒有突然消失、有沒有提到薪酬、面試室的氣氛如何。任何有用的細節都可以。
about.is.p2=搜尋對所有人開放，不用註冊。發佈預設匿名。如果你想多寫幾則，或幫忙管理社群，帳戶和相關工具會在下一階段加入。
about.section.how=如何運作
about.how.p1=重點不是替公司打分，也不是收集怨氣，而是把當時的面試現場，盡量具體地交代給下一個人：問了什麼、哪裡拖了時間、哪裡感覺不對、哪裡比預期好。
about.how.p2=筆記要短、要新。最有用的筆記會浮上來，社群也會一起擋住垃圾訊息和報復性貼文。
about.section.stack=技術架構
about.stack.label.backend=後端
about.stack.label.frontend=前端
about.stack.label.storage=儲存
about.stack.label.deploy=部署
about.stack.intro=整套系統刻意保持簡單：可自行架設，開放原始碼。
about.stack.backend=Java Spring Boot；經典 MVC，配 JSP 頁面、Servlet、JavaBean，加一層精簡的 REST API。預設用 SQLite，幾乎不用設定。
about.stack.frontend=以伺服器端渲染頁面，配合漸進增強。乾淨、易用，只用少量原生 JavaScript；核心體驗不需要沉重的 SPA 框架。
about.stack.data=本地檔案系統，也可選用 MinIO 或任何 S3 相容儲存空間，放截圖和匿名附件；另有 outbox／reconciler 機制，避免資料遺失。
about.stack.deploy=一台 VPS、Docker，甚至 Raspberry Pi 都跑得動。有需要可以用 Cloudflare 提供靜態資源。以英文為主，也可以切換到中文（zh-HK）。
about.section.roadmap=下一步
about.roadmap.submission=最優先做的，是你現在看到的提交與搜尋表單。
about.roadmap.tagging=輪次、地點、遙距／現場、結果等標籤，方便大家快速篩選。
about.roadmap.rating=輕巧的「有幫助」評分，評的是筆記，不是公司，讓最有用的筆記浮上來。
about.roadmap.moderation=簡單的社群管理介面、限制請求頻率，以及附件 outbox。
about.roadmap.export=匯出與備份工具，讓你可以帶走資料，不會鎖死在一部主機。
about.section.open=開放原始碼
about.open.p1=OIEP 是非牟利、可自行架設、由社群維護的專案。你可以自己架一個、fork 這個專案，或在下一次面試後留下一則筆記。
about.open.p2=如果你曾在面試後想過「早知道有人先告訴我」，這裡就是為你而設。
about.cta=留下筆記
about.browse=瀏覽筆記
