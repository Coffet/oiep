# OIEP — optional AI companion component (English).
# Loaded in addition to messages.properties (spring.messages.basename=messages,messages-companion).
# Only used while the component is enabled; see docs/COMPANION.md.

# --- User helper: optional form-filling chat on the public form page ---
companion.helper.kicker=Optional help
companion.helper.title=Stuck on a blank page?
companion.helper.lead=Answer a few questions about this interview in your own words. The helper turns your answers into a draft for this form — you review, edit and submit below. It never posts anything for you.
companion.helper.privacy=The helper is a separate service: the chat is deleted automatically after at most two hours, it is never published, and you should not include names or contact details.
companion.helper.iframeTitle=Interview-experience helper
companion.helper.loadingHint=The helper takes a moment to load. If it does not appear, fill the form yourself — it is optional.
companion.helper.optional=optional
companion.helper.fallback=Helper not loading? Fill the form yourself, or try again later.
companion.helper.apply=Use the helper's answers
companion.helper.applied=Draft copied into the form. Check every field and fix anything that is not right — nothing has been submitted.
companion.helper.checking=Asking the helper for your answers…
companion.helper.appliedCount={0} field(s) filled in from the draft. Check every field and fix anything that is not right — nothing has been submitted.
companion.helper.unchanged=Those fields already have answers, so nothing was overwritten. Compare the draft in the helper and edit the form yourself.
companion.helper.noMatch=The helper's draft did not match any field on this form. Please fill the form yourself.
companion.helper.skipped={0} answer(s) could not be filled in automatically (too long or unclear) — please add them yourself.
companion.helper.notReady=Finish the chat first (press “Review & finish” in the helper), then try again.
companion.helper.unavailable=No draft available yet — finish the chat first. You can still fill the form yourself.
companion.helper.prefillNote=Only matching fields are filled in; nothing is submitted automatically.

